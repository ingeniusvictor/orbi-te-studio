name: CI

on:
  push:
    branches: ["main", "feature/**"]
  pull_request:
    branches: ["main"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install

      - name: Typecheck and test
        run: npm run check

      - name: Generate Casa Goyo A2 artifacts
        run: npm run generate:casa-goyo

      - name: Upload Casa Goyo A2 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: casa-goyo-te1-a2
          path: artifacts/TE1-REF-002-casa-goyo/
          if-no-files-found: error
